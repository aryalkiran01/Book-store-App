<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="KitabGhar" />
    
    <!-- Immediate Theme Initialization Script (prevents flashing) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kitabghar-theme');
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = saved ? saved : (prefersLight ? 'light' : 'dark');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>KitabGhar | Premium Bookstore & Community Reviews</title>
    <meta name="title" content="KitabGhar | Premium Bookstore & Community Reviews" />
    <meta name="description" content="Discover, review, and buy bestsellers and indie books online. Read authentic, verified reader reviews, explore top genres, and enjoy express home delivery." />
    <meta name="keywords" content="bookstore, buy books online, book reviews, bestselling novels, fiction, self-help books, literature, readers community" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KitabGhar" />
    <meta property="og:url" content="https://kitabghar.app/" />
    <meta property="og:title" content="KitabGhar | Premium Bookstore & Community Reviews" />
    <meta property="og:description" content="Discover, review, and buy bestsellers and indie books online. Read authentic, verified reader reviews, explore top genres, and enjoy express home delivery." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- Twitter -->

    <!-- Structured Data: Organization & WebSite Search -->

    {

          "@id": "https://kitabghar.app/#organization",
          "name": "KitabGhar",
          "url": "https://kitabghar.app/",
          "logo": "https://png.pngtree.com/png-vector/20240515/ourmid/pngtree-open-book-logo-png-image_12467719.png",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://kitabghar.app/#website",
          "url": "https://kitabghar.app/",
          "name": "KitabGhar",
          "publisher": {
            "@id": "https://kitabghar.app/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://kitabghar.app/catalog?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
