version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: book_app_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: book_review_app_db
    networks:
      - book_app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: book_app_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/book_review_app_db
      JWT_SECRET: ${JWT_SECRET:-production_secure_random_jwt_secret_key_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      KHALTI_API_KEY: ${KHALTI_API_KEY:-test_secret_key_684f8841a134440092305a2e6462700a}
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - book_app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: book_app_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - book_app_network

networks:
  book_app_network:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
